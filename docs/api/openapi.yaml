openapi: 3.0.3
info:
  title: Soil API
  version: 1.0.0
  description:
servers:
  - url: /api
paths:
  /auth/signup:
    post:
      summary: Cadastro de usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201': { description: Created }
        '400': { description: Bad Request }

  /auth/verify-email/{token}:
    post:
      summary: Verifica e-mail
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Invalid token }

  /auth/resend-verification:
    post:
      summary: Reenvia token de verificação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }

  /auth/pending-approval:
    get:
      summary: Status de aprovação
      responses:
        '200': { description: OK }

  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /auth/forgot-password:
    post:
      summary: Solicita reset de senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }

  /auth/reset-password/{token}:
    post:
      summary: Reseta senha
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string }
      responses:
        '200': { description: OK }
        '400': { description: Invalid token }

  /auth/logout:
    post:
      summary: Logout
      responses:
        '204': { description: No Content }

  /users/me:
    get:
      summary: Dados do usuário logado
      responses:
        '200': { description: OK }
    patch:
      summary: Atualiza dados do usuário logado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200': { description: OK }

  /users/me/password:
    patch:
      summary: Atualiza senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: OK }

  /vehicles:
    get:
      summary: Lista veículos
      parameters:
        - in: query
          name: manufacturer
          schema: { type: string }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      summary: Cria veículo (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleCreate' }
      responses:
        '201': { description: Created }

  /vehicles/{id}:
    get:
      summary: Detalha veículo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: Not Found }
    patch:
      summary: Atualiza veículo (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleUpdate' }
      responses:
        '200': { description: OK }
    delete:
      summary: Remove veículo (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /vehicles/search:
    get:
      summary: Busca avançada de veículos
      responses:
        '200': { description: OK }

  /catalogs:
    get:
      summary: Lista catálogo
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: specification
          schema: { type: string }
      responses:
        '200': { description: OK }
    post:
      summary: Cria item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201': { description: Created }

  /catalogs/{id}:
    get:
      summary: Detalha item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: Not Found }
    patch:
      summary: Atualiza item (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogUpdate' }
      responses:
        '200': { description: OK }
    delete:
      summary: Remove item (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /catalogs/search:
    get:
      summary: Busca avançada de catálogo
      responses:
        '200': { description: OK }

  /technical-specifications:
    get:
      summary: Lista vínculos
      parameters:
        - in: query
          name: vehicle_id
          schema: { type: integer }
        - in: query
          name: catalog_id
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      summary: Cria vínculo (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalog_id, vehicle_id]
              properties:
                catalog_id: { type: integer }
                vehicle_id: { type: integer }
      responses:
        '201': { description: Created }

  /technical-specifications/{id}:
    delete:
      summary: Remove vínculo (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /vehicles/{id}/catalogs:
    get:
      summary: Catálogo compatível do veículo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /catalogs/{id}/vehicles:
    get:
      summary: Veículos compatíveis do catálogo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /products:
    get:
      summary: Lista produtos
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
        - in: query
          name: catalog_id
          schema: { type: integer }
      responses:
        '200': { description: OK }
    post:
      summary: Cria produto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201': { description: Created }

  /products/{id}:
    get:
      summary: Detalha produto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
    patch:
      summary: Atualiza produto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200': { description: OK }
    delete:
      summary: Remove produto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }

  /users/{id}/products:
    get:
      summary: Produtos do usuário
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /lookup:
    get:
      summary: Consulta do mecânico
      parameters:
        - in: query
          name: manufacturer
          schema: { type: string }
        - in: query
          name: model
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: user_id
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /admin/users/pending:
    get:
      summary: Lista usuários pendentes
      responses:
        '200': { description: OK }

  /admin/users/{id}/approve:
    post:
      summary: Aprova usuário
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

  /admin/users/{id}/reject:
    post:
      summary: Rejeita usuário
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }

components:
  schemas:
    SignupRequest:
      type: object
      required: [cnpj, name, email, phone, password]
      properties:
        cnpj: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    VehicleCreate:
      type: object
      required: [manufacturer, model, type, manuf_year_start, manuf_year_end]
      properties:
        manufacturer: { type: string }
        model: { type: string }
        type: { type: string }
        manuf_year_start: { type: integer }
        manuf_year_end: { type: integer }

    VehicleUpdate:
      type: object
      properties:
        manufacturer: { type: string }
        model: { type: string }
        type: { type: string }
        manuf_year_start: { type: integer }
        manuf_year_end: { type: integer }

    CatalogCreate:
      type: object
      required: [type, specification]
      properties:
        type:
          type: string
          enum: [FILTRO, OLEO]
        specification: { type: string }

    CatalogUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [FILTRO, OLEO]
        specification: { type: string }

    ProductCreate:
      type: object
      required: [user_id, catalog_id, price, manufacturer]
      properties:
        user_id: { type: integer }
        catalog_id: { type: integer }
        price: { type: number, format: float }
        manufacturer: { type: string }

    ProductUpdate:
      type: object
      properties:
        catalog_id: { type: integer }
        price: { type: number, format: float }
        manufacturer: { type: string }